services:
  postgres:
    image: postgres:16-alpine
    container_name: manthan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manthan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manthan_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-manthan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manthan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: manthan-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: manthan-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data: